<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Universal Agent Prompt Deck</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Universal Agent Prompt Deck</h1>
      <p class="sub">107 prompts. Sort, filter or search with the controls below.</p>
      <div class="controls">
        <input
          id="q"
          type="search"
          placeholder="Search titles and prompt text"
          aria-label="Search prompts"
        />
        <label class="ctl"
          >Category
          <select id="cat">
            <option value="">All</option>
          </select></label
        >
        <label class="ctl"
          >Pattern
          <select id="pat">
            <option value="">All</option>
          </select></label
        >
        <label class="ctl"
          >Sort
          <select id="sort">
            <option value="order:asc">Deck order</option>
            <option value="title:asc">Title A–Z</option>
            <option value="title:desc">Title Z–A</option>
            <option value="cat:asc">Category</option>
            <option value="pattern:asc">Pattern</option>
            <option value="words:asc">Shortest first</option>
            <option value="words:desc">Longest first</option>
          </select></label
        >
        <button class="ghost" id="toggle" aria-pressed="false">Hide prompt text</button>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="body"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
