<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bead Maze — 3D Capture</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        overflow: hidden;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .overlay {
        position: fixed;
        bottom: 16px;
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid rgba(43, 36, 27, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 4px 16px rgba(43, 36, 27, 0.12);
        backdrop-filter: blur(6px);
        font:
          500 14px/1 system-ui,
          sans-serif;
      }
      .overlay button,
      .overlay a {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 9px 12px;
        background: transparent;
        color: #2b241b;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .overlay button[aria-pressed="true"] {
        background: #2b241b;
        color: #fff;
      }
      .overlay button:hover,
      .overlay a:hover,
      .overlay button:focus-visible,
      .overlay a:focus-visible {
        outline: 2px solid #2b241b;
        outline-offset: 1px;
      }
      .views {
        left: 16px;
      }
      .map-link {
        right: 16px;
      }
      #fallback {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
      }
      body.flat #fallback {
        display: block;
      }
      body.noui .overlay {
        display: none;
      }
      body.flat #scene {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">Three-dimensional photograph of a wooden bead maze</h1>
    <canvas id="scene" aria-label="Interactive 3D photograph of a wooden bead maze"></canvas>
    <div class="overlay views" role="group" aria-label="Camera view">
      <button type="button" data-view="hero" aria-pressed="true">3/4</button>
      <button type="button" data-view="low" aria-pressed="false">Low</button>
      <button type="button" data-view="side" aria-pressed="false">Side</button>
    </div>
    <a class="overlay map-link" href="./codebase-bead-maze.html?map=1">Explore codebase map</a>
    <img id="fallback" src="./bead-maze-view-top.png" alt="Wooden bead maze" />
    <script src="./vendor/three.min.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const VIEWS = {
        hero: { file: "bead-maze-view-top", label: "Three-quarter" },
        low: { file: "bead-maze-view-threequarter", label: "Low" },
        side: { file: "bead-maze-view-front", label: "Side" },
      };
      const initialView = VIEWS[params.get("view")] ? params.get("view") : "hero";
      document.getElementById("fallback").src = `./${VIEWS[initialView].file}.png`;
      if (params.get("ui") === "0") document.body.classList.add("noui");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("scene"),
          antialias: true,
          alpha: false,
        });
      } catch {
        document.body.classList.add("flat");
      }

      if (renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 20);
        const zoom = Math.min(1.8, Math.max(0.6, parseFloat(params.get("zoom") || "1")));
        camera.position.set(0, 0, 1.743 / zoom);

        const loader = new THREE.TextureLoader();
        const maxAniso = renderer.capabilities.getMaxAnisotropy();
        function loadTexture(path, srgb) {
          const texture = loader.load(path);
          texture.colorSpace = THREE.NoColorSpace;
          texture.generateMipmaps = false;
          texture.minFilter = THREE.LinearFilter;
          texture.anisotropy = maxAniso;
          return texture;
        }

        const back = new THREE.Mesh(
          new THREE.PlaneGeometry(1.02, 1.02),
          new THREE.MeshBasicMaterial({
            map: loadTexture(`./${VIEWS[initialView].file}-backdrop.jpg`),
          }),
        );
        back.position.z = -0.04;
        scene.add(back);

        const material = new THREE.ShaderMaterial({
          uniforms: {
            uMap: { value: loadTexture(`./${VIEWS[initialView].file}.png`) },
            uDepth: { value: loadTexture(`./${VIEWS[initialView].file}-depth.png`) },
            uDepthScale: { value: params.get("depth") === "1" ? 0.18 : 0 },
          },
          vertexShader: `
            uniform sampler2D uDepth;
            uniform float uDepthScale;
            varying vec2 vUv;
            void main() {
              vUv = uv;
              float d = texture2D(uDepth, uv).r;
              vec3 p = position;
              p.z += (d - 0.18) * uDepthScale;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D uMap;
            varying vec2 vUv;
            void main() {
              vec4 c = texture2D(uMap, vUv);
              if (c.a < 0.02) discard;
              gl_FragColor = c;
            }
          `,
          transparent: true,
          depthWrite: true,
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 640, 640), material);
        scene.add(mesh);

        const cache = {};
        function getView(name) {
          if (!cache[name]) {
            const base = `./${VIEWS[name].file}`;
            cache[name] = {
              map: loadTexture(`${base}.png`),
              depth: loadTexture(`${base}-depth.png`),
              backdrop: loadTexture(`${base}-backdrop.jpg`),
            };
          }
          return cache[name];
        }

        function setView(name) {
          if (!VIEWS[name]) return;
          const view = getView(name);
          const old = material.uniforms.uMap.value;
          const oldDepth = material.uniforms.uDepth.value;
          const oldBackdrop = back.material.map;
          material.uniforms.uMap.value = view.map;
          material.uniforms.uDepth.value = view.depth;
          back.material.map = view.backdrop;
          back.material.needsUpdate = true;
          document.getElementById("fallback").src = `./${VIEWS[name].file}.png`;
          for (const button of document.querySelectorAll("[data-view]")) {
            button.setAttribute("aria-pressed", String(button.dataset.view === name));
          }
          if (old && old !== view.map) old.dispose();
          if (oldDepth && oldDepth !== view.depth) oldDepth.dispose();
          if (oldBackdrop && oldBackdrop !== view.backdrop) oldBackdrop.dispose();
        }

        for (const button of document.querySelectorAll("[data-view]")) {
          button.addEventListener("click", () => setView(button.dataset.view));
        }
        // Warm the other two views after the first frame.
        setTimeout(() => {
          for (const name of Object.keys(VIEWS)) getView(name);
        }, 250);

        const pointer = new THREE.Vector2();
        const target = new THREE.Vector2();
        target.set(parseFloat(params.get("yaw") || "0"), parseFloat(params.get("pitch") || "0"));
        pointer.copy(target);
        window.addEventListener("pointermove", (event) => {
          target.x = (event.clientX / window.innerWidth) * 2 - 1;
          target.y = -((event.clientY / window.innerHeight) * 2 - 1);
        });

        function resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        window.addEventListener("resize", resize);
        resize();

        function frame() {
          requestAnimationFrame(frame);
          if (reduceMotion) {
            pointer.copy(target);
          } else {
            pointer.lerp(target, 0.06);
          }
          camera.position.x = (pointer.x * 0.014) / zoom;
          camera.position.y = (pointer.y * 0.01) / zoom;
          camera.lookAt(0, 0, 0);
          renderer.render(scene, camera);
        }
        frame();
      }
    </script>
  </body>
</html>
